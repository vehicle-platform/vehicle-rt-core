# Shared template (T24, QUALITY CI-1/CI-2). Copied verbatim into every platform repo
# as .github/workflows/secret-scan.yml (one PR per repo, no sync mechanism); the
# repo also gets .github/workflow-templates/gitleaks.toml as ./.gitleaks.toml.
#
# - gitleaks CLI (not gitleaks-action: that needs a licence for org repos),
#   pinned by version + SHA256, full-history scan (redacted output).
# - pin-check fails when any third-party `uses:` is not a full 40-char SHA.
# To bump gitleaks: change VER and SHA (linux_x64 line of the release checksums.txt).
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          VER: "8.30.1"
          SHA: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner .

  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Every third-party action is pinned to a full commit SHA
        run: |
          if grep -rnP '^\s*-?\s*uses:\s+(?!\./|docker://)[^@\s]+@(?![0-9a-f]{40}(\s|$))' .github; then
            echo "::error::unpinned action(s) above; pin to a full SHA (scripts/pin_actions.py in vehicle-workspace)"
            exit 1
          fi
