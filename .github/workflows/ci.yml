name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Pinned, like the cppcheck cache key below. A normal run takes about 1 min; one apt
    # hang held "Install toolchains" for 16 min, so the job and that step are bounded.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # vehicle-defs is public (D-033), so the submodule needs no extra secret.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # D-003/D-036: consumers pin defs to a release tag, never a branch commit.
      - name: Defs pin must be a release tag
        run: |
          git -C external/vehicle-defs fetch --quiet --depth=1 origin '+refs/tags/*:refs/tags/*'
          tag=$(git -C external/vehicle-defs tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          test -n "$tag" || { echo "::error::external/vehicle-defs is not pinned to a vX.Y.Z release tag"; exit 1; }
          echo "defs pin: $tag"

      - name: Install toolchains
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
          cmake --version | head -1
          arm-none-eabi-gcc --version | head -1

      # The blocking MISRA step needs a fixed cppcheck: Ubuntu's apt cppcheck (2.13) misses
      # findings that 2.22 reports (15.6 on misra/canary.c). Same build as vehicle-defs.
      - name: Restore cppcheck 2.22.0
        id: cppcheck
        uses: actions/cache/restore@v4
        with:
          path: ~/cppcheck
          key: cppcheck-2.22.0-ubuntu-24.04

      - name: Build cppcheck 2.22.0
        if: steps.cppcheck.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          git clone --quiet --depth 1 --branch 2.22.0 https://github.com/danmar/cppcheck.git "$RUNNER_TEMP/cppcheck-src"
          cmake -S "$RUNNER_TEMP/cppcheck-src" -B "$RUNNER_TEMP/cppcheck-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/cppcheck-build" -j "$(nproc)"
          cp -r "$RUNNER_TEMP/cppcheck-build/bin" ~/cppcheck

      - name: Save cppcheck 2.22.0
        if: steps.cppcheck.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/cppcheck
          key: cppcheck-2.22.0-ubuntu-24.04

      - name: Use cppcheck 2.22.0
        run: |
          echo "$HOME/cppcheck" >> "$GITHUB_PATH"
          "$HOME/cppcheck/cppcheck" --version

      # Best effort: the SocketCAN backend test skips (ctest exit 77) without vcan0.
      - name: Virtual CAN interface vcan0
        run: |
          # Azure runner kernels ship vcan in linux-modules-extra.
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || true
          if sudo modprobe vcan && sudo ip link add dev vcan0 type vcan && sudo ip link set up vcan0; then
            ip -brief link show vcan0
          else
            echo "vcan unavailable on this runner: test_can_port_socketcan will be skipped"
          fi

      - name: Host tests + SIL smoke (ASan + UBSan)
        run: |
          cmake --preset host-tests
          cmake --build --preset host-tests
          ctest --preset host-tests

      # Coverage of the target code (host-only hal/host and app/host excluded).
      # Floors, measured 2026-09-29: 97 % lines / 87 % branches (clang); raise them as tests grow.
      # -fprofile-update=atomic (host-coverage preset): the two-thread stress tests would
      # otherwise race the gcov counters into negative hits, which gcovr rejects.
      - name: Coverage (gcov + gcovr, floors 95 % lines / 80 % branches)
        run: |
          pipx install gcovr >/dev/null
          cmake --preset host-coverage
          cmake --build --preset host-coverage
          ctest --preset host-coverage
          gcovr -r . --filter 'src/' --exclude 'src/hal/host/' --exclude 'src/app/host/' \
            --exclude-unreachable-branches --exclude-throw-branches \
            --print-summary --fail-under-line 95 --fail-under-branch 80 build/host-coverage

      - name: Cortex-M7 cross build (Debug + Release)
        run: |
          for p in target-m7-debug target-m7-release; do
            cmake --preset "$p"
            cmake --build --preset "$p"
          done
          arm-none-eabi-size -t build/target-m7-release/src/libvehicle_rtcore_logic.a \
            build/target-m7-release/src/libvehicle_rtcore_fw.a

      # features/ talk to CAN through services/can_if, which carries the vehicle-bus
      # guard (D-020); a direct hal/ include would bypass it.
      - name: Layering (features/ never include hal/)
        run: |
          if grep -rnE '#include[[:space:]]+"hal/' src/features; then
            echo "::error::src/features must use services/, not hal/"
            exit 1
          fi
          # Only services/can_if (with the guard) and hal/ may call the port functions.
          if grep -rnE 'can_port_(write|read|tx_free)[[:space:]]*\(|HAL_FDCAN_AddMessageToTxFifoQ' src \
              | grep -vE '^src/(services/can_if\.c|hal/)'; then
            echo "::error::CAN port access outside services/can_if.c and hal/ bypasses the vehicle-bus guard"
            exit 1
          fi
          # The cross-task atomics (D-065) are used by services/snapshot and services/alive only.
          if grep -rnE '#include[[:space:]]+"hal/hal_atomic\.h"' src | grep -vE '^src/(services|hal)/'; then
            echo "::error::hal/hal_atomic.h is for services/ (snapshot, alive) only"
            exit 1
          fi
          # The IMU FIFO (D-065) has one consumer: the services/imu glue (EKF task). Its pure
          # core and every other module stay off it.
          if grep -rnE '#include[[:space:]]+"hal/imu\.h"' src | grep -vE '^src/(services/imu\.(c|h)|hal/)'; then
            echo "::error::hal/imu.h is for services/imu.c only"
            exit 1
          fi
          # Structural QM separation (D-070 item 5): the derived signals are QM information. Only
          # features/derived itself and the host program may include its headers (any include
          # form); the comms pass reaches the derived task through services/derived_inputs, and
          # that service has one consumer call site, the derived glue.
          if grep -rnE --include='*.c' --include='*.h' '^[[:space:]]*#[[:space:]]*include[[:space:]]*[<"]([^">]*/)?derived(_core|_core_internal|_gear|_windows)?\.h' src \
              | grep -vE '^src/(features/derived|app/host)/'; then
            echo "::error::only src/features/derived and src/app/host may include the derived headers"
            exit 1
          fi
          # services/ sit below features/: the tester epoch and the derived hand-over include no
          # feature header (the ride boundary reaches the derived task through the snapshot).
          # Single-writer rule: only the UDS client glue (comms task) calls tester_epoch_set().
          if grep -rn --include='*.c' --include='*.h' 'tester_epoch_set[[:space:]]*(' src \
              | grep -vE '^src/(services/tester_epoch\.[ch]|features/uds/uds_client\.c):'; then
            echo "::error::tester_epoch_set() has one writer: src/features/uds/uds_client.c"
            exit 1
          fi
          # D-104: the same for services/tester_quality; its one reader is the derived_inputs sampler,
          # which takes and clears the latched step gap.
          if grep -rn --include='*.c' --include='*.h' 'tester_quality_set[[:space:]]*(' src \
              | grep -vE '^src/(services/tester_quality\.[ch]|features/uds/uds_client\.c):'; then
            echo "::error::tester_quality_set() has one writer: src/features/uds/uds_client.c"
            exit 1
          fi
          if grep -rn --include='*.c' --include='*.h' 'tester_quality_take[[:space:]]*(' src \
              | grep -vE '^src/services/(tester_quality|derived_inputs)\.[ch]:'; then
            echo "::error::tester_quality_take() has one reader: src/services/derived_inputs.c"
            exit 1
          fi
          if grep -rnE '#include[[:space:]]+"features/' src/services/tester_epoch.c src/services/tester_epoch.h \
              src/services/tester_quality.c src/services/tester_quality.h \
              src/services/derived_inputs.c src/services/derived_inputs.h \
              src/services/ride_records.c src/services/ride_records.h \
              src/services/ride_records_core.c src/services/ride_records_core.h; then
            echo "::error::services/tester_epoch, tester_quality, derived_inputs and ride_records must not include features/"
            exit 1
          fi
          if grep -rnE --include='*.c' --include='*.h' 'derived_inputs_read[[:space:]]*\(' src \
              | grep -vE '^src/(features/derived/derived\.c|services/derived_inputs\.(c|h)):'; then
            echo "::error::derived_inputs_read() has one consumer call site: src/features/derived/derived.c"
            exit 1
          fi
          # D-098 ride records, derived task -> comms task: one producer call site (the derived
          # glue), one consumer call site (the comms pass), and only the UDS server reads the
          # comms copy (snapshot second-reader rule).
          if grep -rnE --include='*.c' --include='*.h' 'ride_records_publish[[:space:]]*\(' src \
              | grep -vE '^src/(features/derived/derived\.c|services/ride_records\.(c|h)):'; then
            echo "::error::ride_records_publish() has one producer call site: src/features/derived/derived.c"
            exit 1
          fi
          if grep -rnE --include='*.c' --include='*.h' 'ride_records_take[[:space:]]*\(' src \
              | grep -vE '^src/(app/comms\.c|services/ride_records\.(c|h)):'; then
            echo "::error::ride_records_take() has one consumer call site: src/app/comms.c"
            exit 1
          fi
          if grep -rnE --include='*.c' --include='*.h' 'ride_records_read[[:space:]]*\(' src \
              | grep -vE '^src/(features/uds/uds_server\.c|services/ride_records\.(c|h)):'; then
            echo "::error::ride_records_read() is for the UDS server only: src/features/uds/uds_server.c"
            exit 1
          fi
          # D-093 M7<->M4 mailbox: the HSEM interface is used by the mailbox glue only (one
          # accessing context per slot per core; nothing but the locked-section helpers runs
          # while a take holds the interrupt mask), the pure core stays HAL- and feature-free,
          # one offer call site (com_send(), committed frames only) and one step call site
          # (the comms pass), and only the mailbox modules see the generated layout.
          if grep -rnE --include='*.c' --include='*.h' '#include[[:space:]]+"hal/hsem\.h"' src \
              | grep -vE '^src/(services/mailbox\.c|hal/)'; then
            echo "::error::hal/hsem.h is for src/services/mailbox.c (and hal/) only"
            exit 1
          fi
          if grep -rnE --include='*.c' --include='*.h' 'hal_hsem_(take|release|barrier|release_own)[[:space:]]*\(' src \
              | grep -vE '^src/(services/mailbox\.c|hal/)'; then
            echo "::error::the HSEM functions are called by src/services/mailbox.c only"
            exit 1
          fi
          if grep -nE '#include[[:space:]]+"(hal|features)/' src/services/mailbox_core.c src/services/mailbox_core.h; then
            echo "::error::services/mailbox_core is pure: no hal/ or features/ include"
            exit 1
          fi
          if grep -rnE --include='*.c' --include='*.h' 'mailbox_offer[[:space:]]*\(' src \
              | grep -vE '^src/services/(com\.c|mailbox\.(c|h)):'; then
            echo "::error::mailbox_offer() has one call site: src/services/com.c (committed frames only)"
            exit 1
          fi
          # com_send() feeds mailbox_offer(), so its callers must all be comms-task senders
          # (one accessing context per mailbox slot on the M7, safety-reviewer NIT-1): a new
          # sender, e.g. 0x120, is added here only once it runs in the comms task.
          if grep -rnE --include='*.c' --include='*.h' 'com_send[[:space:]]*\(' src \
              | grep -vE '^src/(services/(com|mailbox)\.(c|h)|features/(heartbeat/heartbeat|cornering/lean_tx|vehicle_republish/vehicle_republish)\.c):'; then
            echo "::error::com_send() callers are the comms-task senders only (heartbeat, lean_tx, vehicle_republish)"
            exit 1
          fi
          if grep -rnE --include='*.c' --include='*.h' 'mailbox_step[[:space:]]*\(' src \
              | grep -vE '^src/(app/comms\.c|services/mailbox\.(c|h)):'; then
            echo "::error::mailbox_step() has one call site: src/app/comms.c (the comms task)"
            exit 1
          fi
          if grep -rnE --include='*.c' --include='*.h' '#include[[:space:]]+"(platform_mailbox|services/mailbox(_core)?)\.h"' src \
              | grep -vE '^src/(services/(mailbox|mailbox_core|com)\.(c|h)|app/(comms\.c|host/))'; then
            echo "::error::the mailbox layout and services are included by services/mailbox*, services/com.c and app/comms.c only"
            exit 1
          fi

      - name: Static analysis (cppcheck, blocking)
        run: |
          cppcheck --std=c11 --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem \
            -I src -I external/vehicle-defs/gen/c/rt_core src

      # Blocking: cppcheck style + the MISRA C:2012 addon (rule numbers without rule
      # texts). Deviations are recorded in misra/README.md and listed in
      # misra/suppressions.txt. Host-only code (hal/host, app/host: POSIX, stdio) is not
      # target firmware and is left out.
      - name: Static analysis (cppcheck style + MISRA C:2012, blocking)
        run: |
          # Canary: a missing or broken addon must not pass as a clean run.
          out=$(cppcheck --std=c11 --enable=style --addon=misra --quiet --suppress=missingIncludeSystem \
            --template='{id}' misra/canary.c 2>&1)
          for id in 10.8 15.6 17.7; do
            echo "$out" | grep -qx "misra-c2012-$id" || { echo "::error::the MISRA addon did not report $id on misra/canary.c"; exit 1; }
          done
          if grep -rn 'cppcheck-suppress' src | grep -v 'DEV-[0-9]'; then
            echo "::error::inline cppcheck suppressions must name a deviation (DEV-xxx) from misra/README.md"
            exit 1
          fi
          cppcheck --std=c11 --enable=style --addon=misra --inline-suppr \
            --error-exitcode=1 --suppressions-list=misra/suppressions.txt \
            --suppress=missingIncludeSystem '--suppress=*:*external/*' -i src/hal/host -i src/app/host \
            -I src -I external/vehicle-defs/gen/c/rt_core src

  # The lock-free cross-task exchange (D-065 item 2: services/snapshot, services/alive)
  # under ThreadSanitizer, which cannot share a build with ASan. Includes the two-thread
  # stress tests (the snapshot, and the lean link's EKF and comms sides); a data race or a
  # torn/out-of-order record fails the job.
  thread-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Host tests (ThreadSanitizer)
        run: |
          # TSan's shadow memory fails with the runner kernel's 32-bit mmap ASLR entropy
          # ("unexpected memory mapping"); 28 bits is the long-standing default.
          sudo sysctl -w vm.mmap_rnd_bits=28
          cmake --preset host-tsan
          cmake --build --preset host-tsan
          ctest --preset host-tsan
