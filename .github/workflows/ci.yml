name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Pinned, like the cppcheck cache key below. A normal run takes about 1 min; one apt
    # hang held "Install toolchains" for 16 min, so the job and that step are bounded.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # vehicle-defs is public (D-033), so the submodule needs no extra secret.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      # D-003/D-036: consumers pin defs to a release tag, never a branch commit.
      - name: Defs pin must be a release tag
        run: |
          git -C external/vehicle-defs fetch --quiet --depth=1 origin '+refs/tags/*:refs/tags/*'
          tag=$(git -C external/vehicle-defs tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          test -n "$tag" || { echo "::error::external/vehicle-defs is not pinned to a vX.Y.Z release tag"; exit 1; }
          echo "defs pin: $tag"

      - name: Install toolchains
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
          cmake --version | head -1
          arm-none-eabi-gcc --version | head -1

      # The blocking MISRA step needs a fixed cppcheck: Ubuntu's apt cppcheck (2.13) misses
      # findings that 2.22 reports (15.6 on misra/canary.c). Same build as vehicle-defs.
      - name: Restore cppcheck 2.22.0
        id: cppcheck
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/cppcheck
          key: cppcheck-2.22.0-ubuntu-24.04

      - name: Build cppcheck 2.22.0
        if: steps.cppcheck.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          git clone --quiet --depth 1 --branch 2.22.0 https://github.com/danmar/cppcheck.git "$RUNNER_TEMP/cppcheck-src"
          cmake -S "$RUNNER_TEMP/cppcheck-src" -B "$RUNNER_TEMP/cppcheck-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/cppcheck-build" -j "$(nproc)"
          cp -r "$RUNNER_TEMP/cppcheck-build/bin" ~/cppcheck

      - name: Save cppcheck 2.22.0
        if: steps.cppcheck.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/cppcheck
          key: cppcheck-2.22.0-ubuntu-24.04

      - name: Use cppcheck 2.22.0
        run: |
          echo "$HOME/cppcheck" >> "$GITHUB_PATH"
          "$HOME/cppcheck/cppcheck" --version

      # Best effort: the SocketCAN backend test skips (ctest exit 77) without vcan0.
      - name: Virtual CAN interface vcan0
        run: |
          # Azure runner kernels ship vcan in linux-modules-extra.
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || true
          if sudo modprobe vcan && sudo ip link add dev vcan0 type vcan && sudo ip link set up vcan0; then
            ip -brief link show vcan0
          else
            echo "vcan unavailable on this runner: test_can_port_socketcan will be skipped"
          fi

      - name: Host tests + SIL smoke (ASan + UBSan)
        run: |
          cmake --preset host-tests
          cmake --build --preset host-tests
          ctest --preset host-tests

      # Coverage of the target code (host-only hal/host and app/host excluded).
      # Floors, measured 2026-09-29: 97 % lines / 87 % branches (clang); raise them as tests grow.
      # -fprofile-update=atomic (host-coverage preset): the two-thread stress tests would
      # otherwise race the gcov counters into negative hits, which gcovr rejects.
      - name: Coverage (gcov + gcovr, floors 95 % lines / 80 % branches)
        run: |
          pipx install gcovr >/dev/null
          cmake --preset host-coverage
          cmake --build --preset host-coverage
          ctest --preset host-coverage
          gcovr -r . --filter 'src/' --exclude 'src/hal/host/' --exclude 'src/app/host/' \
            --exclude-unreachable-branches --exclude-throw-branches \
            --print-summary --fail-under-line 95 --fail-under-branch 80 build/host-coverage

      - name: Cortex-M7 cross build (Debug + Release)
        run: |
          for p in target-m7-debug target-m7-release; do
            cmake --preset "$p"
            cmake --build --preset "$p"
          done
          arm-none-eabi-size -t build/target-m7-release/src/libvehicle_rtcore_logic.a \
            build/target-m7-release/src/libvehicle_rtcore_fw.a

      # features/ talk to CAN through services/can_if, which carries the vehicle-bus
      # guard (D-020); a direct hal/ include would bypass it.
      - name: Layering (features/ never include hal/)
        run: |
          if grep -rnE '#include[[:space:]]+"hal/' src/features; then
            echo "::error::src/features must use services/, not hal/"
            exit 1
          fi
          # Only services/can_if (with the guard) and hal/ may call the port functions.
          if grep -rnE 'can_port_(write|read|tx_free)[[:space:]]*\(|HAL_FDCAN_AddMessageToTxFifoQ' src \
              | grep -vE '^src/(services/can_if\.c|hal/)'; then
            echo "::error::CAN port access outside services/can_if.c and hal/ bypasses the vehicle-bus guard"
            exit 1
          fi
          # The cross-task atomics (D-065) are used by services/snapshot and services/alive only.
          if grep -rnE '#include[[:space:]]+"hal/hal_atomic\.h"' src | grep -vE '^src/(services|hal)/'; then
            echo "::error::hal/hal_atomic.h is for services/ (snapshot, alive) only"
            exit 1
          fi
          # The IMU FIFO (D-065) has one consumer: the services/imu glue (EKF task). Its pure
          # core and every other module stay off it.
          if grep -rnE '#include[[:space:]]+"hal/imu\.h"' src | grep -vE '^src/(services/imu\.(c|h)|hal/)'; then
            echo "::error::hal/imu.h is for services/imu.c only"
            exit 1
          fi
          # Structural QM separation (D-070 item 5): the derived signals are QM information. Only
          # features/derived itself and the host program may include its headers (any include
          # form); the comms pass reaches the derived task through services/derived_inputs, and
          # that service has one consumer call site, the derived glue.
          if grep -rnE --include='*.c' --include='*.h' '^[[:space:]]*#[[:space:]]*include[[:space:]]*[<"]([^">]*/)?derived(_core|_core_internal|_gear|_windows)?\.h' src \
              | grep -vE '^src/(features/derived|app/host)/'; then
            echo "::error::only src/features/derived and src/app/host may include the derived headers"
            exit 1
          fi
          # services/ sit below features/: the tester epoch and the derived hand-over include no
          # feature header (the ride boundary reaches the derived task through the snapshot).
          # Single-writer rule: only the UDS client glue (comms task) calls tester_epoch_set().
          if grep -rn --include='*.c' --include='*.h' 'tester_epoch_set[[:space:]]*(' src \
              | grep -vE '^src/(services/tester_epoch\.[ch]|features/uds/uds_client\.c):'; then
            echo "::error::tester_epoch_set() has one writer: src/features/uds/uds_client.c"
            exit 1
          fi
          # D-104: the same for services/tester_quality; its one reader is the derived_inputs sampler,
          # which takes and clears the latched step gap.
          if grep -rn --include='*.c' --include='*.h' 'tester_quality_set[[:space:]]*(' src \
              | grep -vE '^src/(services/tester_quality\.[ch]|features/uds/uds_client\.c):'; then
            echo "::error::tester_quality_set() has one writer: src/features/uds/uds_client.c"
            exit 1
          fi
          if grep -rn --include='*.c' --include='*.h' 'tester_quality_take[[:space:]]*(' src \
              | grep -vE '^src/services/(tester_quality|derived_inputs)\.[ch]:'; then
            echo "::error::tester_quality_take() has one reader: src/services/derived_inputs.c"
            exit 1
          fi
          if grep -rnE '#include[[:space:]]+"features/' src/services/tester_epoch.c src/services/tester_epoch.h \
              src/services/tester_quality.c src/services/tester_quality.h \
              src/services/derived_inputs.c src/services/derived_inputs.h \
              src/services/ride_records.c src/services/ride_records.h \
              src/services/ride_records_core.c src/services/ride_records_core.h; then
            echo "::error::services/tester_epoch, tester_quality, derived_inputs and ride_records must not include features/"
            exit 1
          fi
          if grep -rnE --include='*.c' --include='*.h' 'derived_inputs_read[[:space:]]*\(' src \
              | grep -vE '^src/(features/derived/derived\.c|services/derived_inputs\.(c|h)):'; then
            echo "::error::derived_inputs_read() has one consumer call site: src/features/derived/derived.c"
            exit 1
          fi
          # D-098 ride records, derived task -> comms task: one producer call site (the derived
          # glue), one consumer call site (the comms pass), and only the UDS server reads the
          # comms copy (snapshot second-reader rule).
          if grep -rnE --include='*.c' --include='*.h' 'ride_records_publish[[:space:]]*\(' src \
              | grep -vE '^src/(features/derived/derived\.c|services/ride_records\.(c|h)):'; then
            echo "::error::ride_records_publish() has one producer call site: src/features/derived/derived.c"
            exit 1
          fi
          if grep -rnE --include='*.c' --include='*.h' 'ride_records_take[[:space:]]*\(' src \
              | grep -vE '^src/(app/comms\.c|services/ride_records\.(c|h)):'; then
            echo "::error::ride_records_take() has one consumer call site: src/app/comms.c"
            exit 1
          fi
          if grep -rnE --include='*.c' --include='*.h' 'ride_records_read[[:space:]]*\(' src \
              | grep -vE '^src/(features/uds/uds_server\.c|services/ride_records\.(c|h)):'; then
            echo "::error::ride_records_read() is for the UDS server only: src/features/uds/uds_server.c"
            exit 1
          fi
          # D-118: com_send() callers are the comms-task senders only (one accessing context
          # per TX buffer / E2E state); a new platform sender is added here once it runs there.
          if grep -rnE --include='*.c' --include='*.h' 'com_send[[:space:]]*\(' src \
              | grep -vE '^src/(services/com\.(c|h)|features/(heartbeat/heartbeat|cornering/lean_tx|vehicle_republish/vehicle_republish)\.c):'; then
            echo "::error::com_send() callers are the comms-task senders only (heartbeat, lean_tx, vehicle_republish)"
            exit 1
          fi
          # D-118: the H755 mailbox and HSEM are retired; nothing may bring them back.
          if grep -rniE --include='*.c' --include='*.h' 'hsem|platform_mailbox|services/mailbox' src; then
            echo "::error::the inter-core mailbox / HSEM is retired (D-118)"
            exit 1
          fi
          # D-118 (safety review MINOR-4): platform TX goes through com_send() only (the UDS
          # link keeps its own write); nobody else may put a frame on FDCAN2.
          if grep -rnE --include='*.c' --include='*.h' 'can_if_write[[:space:]]*\(' src \
              | grep -vE '^src/(features/uds/isotp_link\.(c|h)|services/(com|can_if)\.(c|h)):'; then
            echo "::error::can_if_write() is called by features/uds/isotp_link and services/com only"
            exit 1
          fi
          # The safety MCU's own IDs: 0x023 appears nowhere in src/ (rt-core neither sends nor
          # registers it); 0x082 only in the diagnostic monitor (features/safety_hb, D-118 item 6,
          # the one receiver) and the host SIL's simulated safety MCU (the sender of its test frames).
          if grep -rnE --include='*.c' --include='*.h' 'PLATFORM_SAFETY_WARNING_STATUS_' src; then
            echo "::error::0x023 belongs to the safety MCU: its frame ID must not appear in src/"
            exit 1
          fi
          if grep -rnE --include='*.c' --include='*.h' 'PLATFORM_HEARTBEAT_SAFETY_FRAME_ID' src \
              | grep -vE '^src/(features/safety_hb/safety_hb\.c|app/host/sim_safety\.c):'; then
            echo "::error::0x082's frame ID appears in src/features/safety_hb/safety_hb.c (receiver) and src/app/host/sim_safety.c only"
            exit 1
          fi
          # D-118 item 6: the received 0x082 is diagnostic input only. Its E2E check, state and
          # link counters stay in features/safety_hb; no other feature, and no service or app
          # code except the comms pass (the one step call) and the host program, uses the module,
          # so it cannot reach 0x020, the EKF, the heartbeat or anything sent to the safety MCU.
          if grep -rnE --include='*.c' --include='*.h' 'platform_heartbeat_safety_|PLATFORM_HEARTBEAT_SAFETY_E2E|safety_hb' src \
              | grep -vE '^src/(features/safety_hb/[a-z_]+\.[ch]|app/comms\.(c|h)|app/host/(main|sim_safety)\.(c|h)):'; then
            echo "::error::the 0x082 monitor (safety_hb, platform_heartbeat_safety_*) is used by features/safety_hb, app/comms and the host program only"
            exit 1
          fi
          if grep -rnE --include='*.c' --include='*.h' 'safety_hb_step[[:space:]]*\(' src \
              | grep -vE '^src/(features/safety_hb/safety_hb\.(c|h)|app/comms\.(c|h)):'; then
            echo "::error::safety_hb_step() has one call site: src/app/comms.c"
            exit 1
          fi
          # Raw vehicle_e2e_protect() (a hand-built protected frame) only in the host SIL's
          # simulated peers; firmware senders protect through the generated per-message wrappers.
          if grep -rnE --include='*.c' --include='*.h' 'vehicle_e2e_protect[[:space:]]*\(' src \
              | grep -vE '^src/app/host/'; then
            echo "::error::raw vehicle_e2e_protect() belongs to src/app/host/ only; use the generated platform_<msg>_e2e_protect()"
            exit 1
          fi
          # The simulated safety MCU is bound to the in-process bus only: it takes a vbus_t and
          # never includes the SocketCAN backend, and the host program hands it the platform bus.
          if grep -nE 'socketcan|can_port_host|can_port\.h' src/app/host/sim_safety.c src/app/host/sim_safety.h; then
            echo "::error::sim_safety must not touch a real or vcan interface (in-process vbus only)"
            exit 1
          fi
          if grep -n 'sim_safety_init' src/app/host/main.c | grep -v '&platform_bus'; then
            echo "::error::sim_safety_init() must be given the in-process platform bus"
            exit 1
          fi
          # The DTC is classified diagnostic only by the generated flag (services/diag.c); its
          # index is reported by the monitor alone (D-118 item 6).
          if grep -rnE --include='*.c' --include='*.h' 'DTC_IDX_SAFETY_HEARTBEAT_LOST' src \
              | grep -vE '^src/(services/diag\.c|features/safety_hb/safety_hb\.c|app/host/main\.c):'; then
            echo "::error::DTC_IDX_SAFETY_HEARTBEAT_LOST appears in services/diag.c, features/safety_hb/safety_hb.c and the host program only"
            exit 1
          fi
          if grep -rnE --include='*.c' --include='*.h' 'diag_dtc_report[[:space:]]*\([^;]*SAFETY_HEARTBEAT_LOST' src \
              | grep -vE '^src/features/safety_hb/safety_hb\.c:'; then
            echo "::error::only features/safety_hb reports SAFETY_HEARTBEAT_LOST"
            exit 1
          fi
          # 0x120 SafetyRequest: at most one future sender file (none today), which never
          # registers a receiver (it must not be filled from a received frame).
          req=$(grep -rlE --include='*.c' --include='*.h' 'PLATFORM_SAFETY_REQUEST_|platform_safety_request_pack' src || true)
          if [ "$(echo "$req" | grep -c .)" -gt 1 ]; then
            echo "::error::PLATFORM_SAFETY_REQUEST_ / platform_safety_request_pack in more than one file: $req"
            exit 1
          fi
          if [ -n "$req" ] && grep -nE 'can_if_register_rx' $req; then
            echo "::error::the 0x120 sender must not register a platform receiver"
            exit 1
          fi

      - name: Static analysis (cppcheck, blocking)
        run: |
          cppcheck --std=c11 --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem \
            -I src -I external/vehicle-defs/gen/c/rt_core src

      # Blocking: cppcheck style + the MISRA C:2012 addon (rule numbers without rule
      # texts). Deviations are recorded in misra/README.md and listed in
      # misra/suppressions.txt. Host-only code (hal/host, app/host: POSIX, stdio) is not
      # target firmware and is left out.
      - name: Static analysis (cppcheck style + MISRA C:2012, blocking)
        run: |
          # Canary: a missing or broken addon must not pass as a clean run.
          out=$(cppcheck --std=c11 --enable=style --addon=misra --quiet --suppress=missingIncludeSystem \
            --template='{id}' misra/canary.c 2>&1)
          for id in 10.8 15.6 17.7; do
            echo "$out" | grep -qx "misra-c2012-$id" || { echo "::error::the MISRA addon did not report $id on misra/canary.c"; exit 1; }
          done
          if grep -rn 'cppcheck-suppress' src cubemx/User | grep -v 'DEV-[0-9]'; then
            echo "::error::inline cppcheck suppressions must name a deviation (DEV-xxx) from misra/README.md"
            exit 1
          fi
          cppcheck --std=c11 --enable=style --addon=misra --inline-suppr \
            --error-exitcode=1 --suppressions-list=misra/suppressions.txt \
            --suppress=missingIncludeSystem '--suppress=*:*external/*' -i src/hal/host -i src/app/host \
            -I src -I external/vehicle-defs/gen/c/rt_core src
          # The non-generated CubeMX-side code (T77). The generated HAL/CMSIS/FreeRTOS headers
          # are only parsed (findings inside them are not ours).
          F=cubemx/Middlewares/Third_Party/FreeRTOS/Source
          cppcheck --std=c11 --enable=style --addon=misra --inline-suppr \
            --error-exitcode=1 --suppressions-list=misra/suppressions.txt \
            --suppress=missingIncludeSystem --suppress=unusedFunction \
            '--suppress=*:*external/*' '--suppress=*:*cubemx/Drivers/*' '--suppress=*:*cubemx/Inc/*' \
            '--suppress=*:*cubemx/Middlewares/*' \
            -DSTM32H743xx -DUSE_HAL_DRIVER \
            -I src -I external/vehicle-defs/gen/c/rt_core -I cubemx/User -I cubemx/Inc \
            -I cubemx/Drivers/STM32H7xx_HAL_Driver/Inc -I cubemx/Drivers/CMSIS/Device/ST/STM32H7xx/Include \
            -I cubemx/Drivers/CMSIS/Include -I cubemx/Drivers/CMSIS/RTOS2/Include \
            -I $F/include -I $F/CMSIS_RTOS_V2 -I $F/portable/GCC/ARM_CM4F \
            cubemx/User

  # FW-2 / T27: complexity and size ratchet (CCN <= 15, function <= 100 lines, file <= 600
  # lines). Existing offenders sit in tools/lizard_baseline.txt; new code must comply and the
  # baseline may only shrink. Applies to every file under src/ (checking, not editing).
  complexity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install lizard
        run: pipx install lizard==1.26.1

      - name: Complexity ratchet (lizard)
        run: python3 tools/lizard_gate.py

      # FW-3 / T27: the golden vectors are generated by vehicle-server; a hand-edited or stale
      # copy must fail. Each header's content-sha256 banner must match its body and the copy of
      # vehicle-server's tests/golden/MANIFEST.sha256 (resync both together).
      - name: Golden vector integrity
        run: python3 tools/check_vectors.py

  # The lock-free cross-task exchange (D-065 item 2: services/snapshot, services/alive)
  # under ThreadSanitizer, which cannot share a build with ASan. Includes the two-thread
  # stress tests (the snapshot, and the lean link's EKF and comms sides); a data race or a
  # torn/out-of-order record fails the job.
  thread-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Ninja
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Host tests (ThreadSanitizer)
        run: |
          # TSan's shadow memory fails with the runner kernel's 32-bit mmap ASLR entropy
          # ("unexpected memory mapping"); 28 bits is the long-standing default.
          sudo sysctl -w vm.mmap_rnd_bits=28
          cmake --preset host-tsan
          cmake --build --preset host-tsan
          ctest --preset host-tsan

  # T67: boot test of the CubeMX image in Renode (no board needed). Renode and the Python
  # packages are pinned; the tarball is verified against the SHA-256 GitHub publishes for the
  # release asset. See tests/renode/README.md for what is covered and what is stubbed.
  renode-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RENODE_VERSION: "1.17.0"
      RENODE_SHA256: "4ba7c68b59e2447f188ef4b4b112fcccd2802582c460beedceb63b84e5605a5f"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      # Same toolchain source as the build-and-test job (Ubuntu's gcc-arm-none-eabi).
      - name: Install toolchain
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1

      - name: Build the CubeMX image (Debug)
        working-directory: cubemx
        run: |
          cmake --preset Debug
          cmake --build --preset Debug

      # T77 / invariant 5: the linked image must contain no malloc/free/_sbrk (the generated
      # sysmem.c is replaced by an always-failing _sbrk). The FreeRTOS heap_4 residual is
      # reported, not failed, until T13 (cubemx/README.md, Open).
      - name: No heap in the CubeMX image (nm, Debug and Release)
        run: |
          # Canary: the gate must fail on an image that really uses malloc.
          printf '#include <stdlib.h>\nint main(void){void *p = malloc(8); free(p); return 0;}\n' > "$RUNNER_TEMP/canary.c"
          arm-none-eabi-gcc -mcpu=cortex-m7 --specs=nosys.specs "$RUNNER_TEMP/canary.c" -o "$RUNNER_TEMP/canary.elf" 2>/dev/null
          if python3 tools/check_image_heap.py --nm arm-none-eabi-nm "$RUNNER_TEMP/canary.elf" 2>/dev/null; then
            echo "::error::the heap gate did not fail on the malloc canary"; exit 1
          fi
          python3 tools/check_image_heap.py --nm arm-none-eabi-nm cubemx/build/Debug/rt-core.elf
          (cd cubemx && cmake --preset Release && cmake --build --preset Release)
          python3 tools/check_image_heap.py --nm arm-none-eabi-nm cubemx/build/Release/rt-core.elf

      # T77 item 3: the fault handlers must not push (a push onto an exhausted stack locks the
      # core up). Each starts with ldr (_estack), msr MSP and contains no push/stmdb/sp-store.
      # F1: the fault record is an orphan .noinit section; the linker script is not edited, so
      # its placement is asserted here (NOBITS, after _ebss, before the heap/stack region).
      - name: .noinit placement (readelf)
        run: python3 tools/check_noinit_layout.py cubemx/build/Debug/rt-core.elf cubemx/build/Release/rt-core.elf

      - name: Fault handlers are stack-free (objdump)
        run: python3 tools/check_fault_handlers.py --objdump arm-none-eabi-objdump cubemx/build/Debug/rt-core.elf cubemx/build/Release/rt-core.elf

      - name: Install Renode ${{ env.RENODE_VERSION }}
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/renode.tar.gz" \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          echo "${RENODE_SHA256}  $RUNNER_TEMP/renode.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/renode"
          tar -xzf "$RUNNER_TEMP/renode.tar.gz" -C "$HOME/renode" --strip-components=1
          python3 -m venv "$HOME/rvenv"
          "$HOME/rvenv/bin/pip" install --quiet -r tests/renode/requirements.txt

      - name: Renode boot test
        run: |
          mkdir -p "$RUNNER_TEMP/robot"
          cd "$RUNNER_TEMP/robot"
          PATH="$HOME/rvenv/bin:$PATH" "$HOME/renode/renode-test" "$GITHUB_WORKSPACE/tests/renode/boot.robot"

      - name: Upload the Robot log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: renode-boot-rt-core
          path: |
            ${{ runner.temp }}/robot/log.html
            ${{ runner.temp }}/robot/report.html
            ${{ runner.temp }}/robot/robot_output.xml
            ${{ runner.temp }}/robot/logs
          if-no-files-found: warn
          retention-days: 14

  # Aggregate required check (QUALITY CI-4): one stable name for the ruleset.
  # `skipped` counts as OK; `failure` and `cancelled` fail it.
  ci-ok:
    if: always()
    needs: [build-and-test, complexity, thread-sanitizer, renode-boot]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
